# Gazette Voice API draft. Every operation is x-status: planned until the add-on is imported.
openapi: 3.0.3
info:
  title: Gazette Voice (contrib add-on for ilm.red)
  version: 0.1.0
  description: Planned operations. Served only after the add-on is imported into ilm.red. See docs/API.md. The existing getClubGazette read gains an additive `newsroom` object per paper (schema NewsroomStory).
servers:
  - url: https://api.ilm.red/v1
tags:
  - name: Gazette Voice
paths:
  /gazette/stories/{story_id}/history:
    get:
      operationId: getGazetteStoryHistory
      summary: Versions of a Newsroom story, newest first
      tags:
        - Gazette Voice
      x-status: planned
      x-who: anyone who can see the club
      parameters:
        - name: story_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/History"
        default:
          $ref: "#/components/responses/Problem"
  /me/gazette-voice/prefs:
    get:
      operationId: getGazetteVoicePrefs
      summary: The reader's term highlight settings
      tags:
        - Gazette Voice
      x-status: planned
      x-who: signed-in member
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prefs"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putGazetteVoicePrefs
      summary: Save the reader's term highlight settings
      tags:
        - Gazette Voice
      x-status: planned
      x-who: signed-in member
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prefs"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Prefs"
  /gazette/stories/{story_id}/fixes:
    post:
      operationId: createGazetteFix
      summary: Suggest a fix to a Newsroom story
      tags:
        - Gazette Voice
      x-status: planned
      x-who: signed-in member of the club
      parameters:
        - name: story_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixCreated"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FixCreate"
  /clubs/{club_id}/gazette/ops/summary:
    get:
      operationId: getGazetteOpsSummary
      summary: Spend, calls and fixes for an edition
      tags:
        - Gazette Voice
      x-status: planned
      x-who: manager
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: string
        - name: week
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsSummary"
        default:
          $ref: "#/components/responses/Problem"
  /clubs/{club_id}/gazette/ops/runs:
    get:
      operationId: listGazetteRuns
      summary: Runs newest first
      tags:
        - Gazette Voice
      x-status: planned
      x-who: manager
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        default:
          $ref: "#/components/responses/Problem"
  /clubs/{club_id}/gazette/ops/runs/{run_id}:
    get:
      operationId: getGazetteRun
      summary: One run with its stories and calls
      tags:
        - Gazette Voice
      x-status: planned
      x-who: manager
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        default:
          $ref: "#/components/responses/Problem"
  /clubs/{club_id}/gazette/ops/calls:
    get:
      operationId: listGazetteCalls
      summary: Model calls without bodies
      tags:
        - Gazette Voice
      x-status: planned
      x-who: manager
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: string
        - name: run
          in: query
          required: false
          schema:
            type: string
        - name: stage
          in: query
          required: false
          schema:
            type: string
        - name: story
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallList"
        default:
          $ref: "#/components/responses/Problem"
  /clubs/{club_id}/gazette/ops/calls/{call_id}:
    get:
      operationId: getGazetteCall
      summary: One call with its prompt by layer, reply, checks and verdicts
      tags:
        - Gazette Voice
      x-status: planned
      x-who: manager
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: string
        - name: call_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        default:
          $ref: "#/components/responses/Problem"
  /clubs/{club_id}/gazette/prompts:
    get:
      operationId: listGazettePrompts
      summary: Stages and languages with their default voice version
      tags:
        - Gazette Voice
      x-status: planned
      x-who: manager
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptList"
        default:
          $ref: "#/components/responses/Problem"
  /clubs/{club_id}/gazette/prompts/{stage}/{lang}:
    get:
      operationId: getGazettePrompt
      summary: House frame, voice versions and learned rules
      tags:
        - Gazette Voice
      x-status: planned
      x-who: manager
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: string
        - name: stage
          in: path
          required: true
          schema:
            type: string
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"
        default:
          $ref: "#/components/responses/Problem"
  /clubs/{club_id}/gazette/prompts/{stage}/{lang}/versions:
    post:
      operationId: createGazettePromptVersion
      summary: Save a new club voice version
      tags:
        - Gazette Voice
      x-status: planned
      x-who: manager
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: string
        - name: stage
          in: path
          required: true
          schema:
            type: string
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceVersion"
  /clubs/{club_id}/gazette/prompts/{stage}/{lang}/default:
    post:
      operationId: setGazettePromptDefault
      summary: Make a version the default (also how a rollback is done)
      tags:
        - Gazette Voice
      x-status: planned
      x-who: manager
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: string
        - name: stage
          in: path
          required: true
          schema:
            type: string
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRef"
  /clubs/{club_id}/gazette/prompts/{stage}/{lang}/try:
    post:
      operationId: tryGazettePrompt
      summary: Try a voice version on up to 3 papers; never published
      tags:
        - Gazette Voice
      x-status: planned
      x-who: manager
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: string
        - name: stage
          in: path
          required: true
          schema:
            type: string
        - name: lang
          in: path
          required: true
          schema:
            type: string
        - name: estimate
          in: query
          required: false
          schema:
            type: boolean
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queued"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TryRequest"
      x-spends: house AI budget, priced first with ?estimate=true, counted against the edition cap
  /clubs/{club_id}/gazette/fixes:
    get:
      operationId: listGazetteFixes
      summary: The fixes queue
      tags:
        - Gazette Voice
      x-status: planned
      x-who: manager
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixList"
        default:
          $ref: "#/components/responses/Problem"
  /gazette/fixes/{fix_id}/action:
    post:
      operationId: actOnGazetteFix
      summary: Apply, regenerate, learn, reject or undo a fix
      tags:
        - Gazette Voice
      x-status: planned
      x-who: manager
      parameters:
        - name: fix_id
          in: path
          required: true
          schema:
            type: string
        - name: estimate
          in: query
          required: false
          schema:
            type: boolean
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixActed"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FixAction"
      x-spends: house AI budget, priced first with ?estimate=true, counted against the edition cap
  /clubs/{club_id}/gazette/learned/{rule_id}:
    patch:
      operationId: updateGazetteLearnedRule
      summary: Edit, pin or remove a learned rule
      tags:
        - Gazette Voice
      x-status: planned
      x-who: manager
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: string
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearnedPatch"
  /gazette/stories/{story_id}/undo:
    post:
      operationId: undoGazetteStory
      summary: Back to an earlier revision
      tags:
        - Gazette Voice
      x-status: planned
      x-who: manager
      parameters:
        - name: story_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revision"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionRef"
  /clubs/{club_id}/gazette/term-labels/{term_slug}:
    put:
      operationId: setGazetteTermLabel
      summary: A manager's Gazette label for a term (never the shared term level)
      tags:
        - Gazette Voice
      x-status: planned
      x-who: manager
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: string
        - name: term_slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermLabel"
components:
  schemas:
    Ok:
      type: object
      properties:
        ok:
          type: boolean
    Prefs:
      type: object
      properties:
        highlight:
          type: boolean
        levels:
          type: array
          items:
            type: string
            enum:
              - easy
              - advanced
              - expert
      required:
        - highlight
        - levels
    NewsroomStory:
      type: object
      properties:
        story_id:
          type: string
        paper_id:
          type: string
        paper_path:
          type: string
        lang:
          type: string
          enum:
            - en
            - ur
        state:
          type: string
          enum:
            - ready
            - plain
        headline:
          type: string
        dept:
          type: string
        byline:
          type: string
        body:
          type: string
          description: Text with inline links as [anchor](url)
        question:
          type: string
        chips:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
              label:
                type: string
              detail:
                type: string
              url:
                type: string
        terms:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              slug:
                type: string
              level:
                type: string
                enum:
                  - easy
                  - advanced
                  - expert
              start:
                type: integer
              end:
                type: integer
              hook:
                type: string
                nullable: true
        update:
          type: string
          nullable: true
        revision:
          type: integer
      required:
        - story_id
        - state
        - headline
        - body
        - terms
        - revision
    History:
      type: object
      properties:
        revisions:
          type: array
          items:
            type: object
            properties:
              revision:
                type: integer
              at:
                type: string
              kind:
                type: string
              summary:
                type: string
              who:
                type: string
                enum:
                  - desk
                  - member
                  - manager
                  - automatic
              undoable:
                type: boolean
    FixCreate:
      type: object
      properties:
        kind:
          type: string
          enum:
            - fact
            - link
            - tone
            - wording
            - term_level
            - wrong_term
            - other
        quote:
          type: string
          maxLength: 500
        start:
          type: integer
        end:
          type: integer
        replacement:
          type: string
          maxLength: 500
        reason:
          type: string
          maxLength: 500
      required:
        - kind
        - replacement
    FixCreated:
      type: object
      properties:
        fix_id:
          type: string
        state:
          type: string
          enum:
            - applied
            - waiting
        revision:
          type: integer
    OpsSummary:
      type: object
      properties:
        edition_cost_usd:
          type: number
        month_cost_usd:
          type: number
        month_editions:
          type: integer
        cap_usd:
          type: number
        calls:
          type: integer
        median_ms:
          type: number
        stories_ready:
          type: integer
        stories_plain:
          type: integer
        open_fixes:
          type: integer
        auto_fixes_today:
          type: integer
    RunList:
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        next_cursor:
          type: string
          nullable: true
    Run:
      type: object
      properties:
        run_id:
          type: string
        kind:
          type: string
          enum:
            - edition
            - trial
            - regenerate
            - update
        week:
          type: string
        lang:
          type: string
        stages:
          type: array
          items:
            type: string
        stories:
          type: integer
        calls:
          type: integer
        cost_usd:
          type: number
        estimate_usd:
          type: number
        status:
          type: string
        started_at:
          type: string
    CallList:
      type: object
      properties:
        calls:
          type: array
          items:
            type: object
            properties:
              call_id:
                type: integer
              run_id:
                type: string
              stage:
                type: string
              model:
                type: string
              tokens_in:
                type: integer
              tokens_out:
                type: integer
              cached_in:
                type: integer
              cost_usd:
                type: number
              ms:
                type: integer
              status:
                type: string
              at:
                type: string
        next_cursor:
          type: string
          nullable: true
    Call:
      type: object
      properties:
        call_id:
          type: integer
        stage:
          type: string
        model:
          type: string
        request:
          type: object
          properties:
            layers:
              type: array
              items:
                type: object
                properties:
                  kind:
                    type: string
                    enum:
                      - house
                      - stage
                      - voice
                      - learned
                      - data
                  version:
                    type: string
                  text:
                    type: string
            truncated:
              type: boolean
        reply:
          type: object
          properties:
            text:
              type: string
            truncated:
              type: boolean
        checks:
          type: object
        verdicts:
          type: object
        tokens_in:
          type: integer
        tokens_out:
          type: integer
        cost_usd:
          type: number
        ms:
          type: integer
        status:
          type: string
    PromptList:
      type: object
      properties:
        prompts:
          type: array
          items:
            type: object
            properties:
              stage:
                type: string
              lang:
                type: string
              default_version:
                type: integer
              learned:
                type: integer
    Prompt:
      type: object
      properties:
        house:
          type: object
          properties:
            text:
              type: string
            version:
              type: string
        default_version:
          type: integer
        versions:
          type: array
          items:
            type: object
            properties:
              version:
                type: integer
              voice:
                type: string
              note:
                type: string
              at:
                type: string
        learned:
          type: array
          items:
            type: object
            properties:
              rule_id:
                type: string
              text:
                type: string
              pinned:
                type: boolean
              from_fix:
                type: string
    VoiceVersion:
      type: object
      properties:
        voice:
          type: string
          minLength: 20
          maxLength: 6000
        note:
          type: string
          maxLength: 300
      required:
        - voice
    Version:
      type: object
      properties:
        version:
          type: integer
        default_version:
          type: integer
    VersionRef:
      type: object
      properties:
        version:
          type: integer
      required:
        - version
    TryRequest:
      type: object
      properties:
        version:
          type: integer
        paper_ids:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
        budget_usd:
          type: number
      required:
        - version
        - paper_ids
        - budget_usd
    Queued:
      type: object
      properties:
        run_id:
          type: string
        estimate_usd:
          type: number
        status:
          type: string
          enum:
            - priced
            - queued
    FixList:
      type: object
      properties:
        fixes:
          type: array
          items:
            type: object
            properties:
              fix_id:
                type: string
              story_id:
                type: string
              headline:
                type: string
              kind:
                type: string
              quote:
                type: string
              replacement:
                type: string
              reason:
                type: string
              member:
                type: string
              check:
                type: object
                properties:
                  flagged:
                    type: boolean
                  problems:
                    type: array
                    items:
                      type: string
                  supported:
                    type: boolean
              state:
                type: string
              auto:
                type: boolean
              at:
                type: string
        next_cursor:
          type: string
          nullable: true
    FixAction:
      type: object
      properties:
        action:
          type: string
          enum:
            - apply
            - regenerate
            - learn
            - reject
            - undo
        reply:
          type: string
          maxLength: 500
        rule:
          type: string
          minLength: 5
          maxLength: 300
        budget_usd:
          type: number
      required:
        - action
    FixActed:
      type: object
      properties:
        state:
          type: string
        revision:
          type: integer
        learned_id:
          type: string
        estimate_usd:
          type: number
    LearnedPatch:
      type: object
      properties:
        text:
          type: string
          minLength: 5
          maxLength: 300
        pinned:
          type: boolean
        removed:
          type: boolean
    RevisionRef:
      type: object
      properties:
        revision:
          type: integer
      required:
        - revision
    Revision:
      type: object
      properties:
        revision:
          type: integer
    TermLabel:
      type: object
      properties:
        level:
          type: string
          enum:
            - easy
            - advanced
            - expert
      required:
        - level
    Problem:
      type: object
      properties:
        type:
          type: string
          description: not_signed_in, not_club_member, not_club_manager, validation_failed, one_open_fix_per_story, daily_limit, daily_regeneration_limit, over_budget, not_found, not_waiting
        title:
          type: string
        field:
          type: string
  responses:
    Problem:
      description: Refusal
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
